<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Noto Sans Kannada', sans-serif;
      width: 330px;
      padding: 12px;
      margin: 0;
      background: #fafafa;
      color: #1f1f1f;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #b71c1c;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    h3 { margin: 0; font-size: 15px; color: #b71c1c; }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 6px 4px;
      background: #e8eaed;
      color: #333;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: bold;
    }
    .tab-btn.active {
      background: #b71c1c;
      color: #fff;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12.5px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      margin-bottom: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
    }
    button.primary {
      width: 100%;
      padding: 7px;
      background: #0b57d0;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    button.primary:hover { background: #0842a0; }
    button.secondary {
      width: 49%;
      padding: 6px;
      background: #444746;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11.5px;
    }
    .list-box {
      max-height: 120px;
      overflow-y: auto;
      border-top: 1px solid #ddd;
      margin-top: 6px;
      padding-top: 6px;
      font-size: 12px;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px dashed #eee;
    }
    .del-btn {
      color: #c5221f;
      cursor: pointer;
      font-weight: bold;
    }
    .badge {
      background: #e6f4ea;
      color: #137333;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
      text-align: center;
      font-weight: bold;
    }
    .tester-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      margin-top: 8px;
    }
    #testOutput {
      margin-top: 6px;
      font-size: 12.5px;
      color: #0b57d0;
      font-weight: bold;
      min-height: 18px;
    }
    #status {
      font-size: 12px;
      color: #137333;
      text-align: center;
      margin-top: 6px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>ಅಚ್ಚಗನ್ನಡ ಪರಿವರ್ತಕ v5.0</h3>
    <label style="font-size:12px;">
      <input type="checkbox" id="toggleActive" checked> ಸಕ್ರಿಯ (On)
    </label>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tabWords">ಪದಗಳು (Words)</button>
    <button class="tab-btn" data-tab="tabBulk">12,000+ Import</button>
    <button class="tab-btn" data-tab="tabSites">ತಾಣಗಳು (Sites)</button>
  </div>

  <!-- TAB 1: Quick Add + Live Morphology Tester -->
  <div id="tabWords" class="tab-panel active">
    <div class="row">
      <label for="toggleHighlight">ಮೂಲ ಪದ & ಪರ್ಯಾಯ ಸುಳಿವು (Tooltips)</label>
      <input type="checkbox" id="toggleHighlight" checked>
    </div>

    <input type="text" id="sanskritInput" placeholder="ಸಂಸ್ಕೃತ ಮೂಲ ಪದ (ಉದಾ: ಆರೋಪ)">
    <input type="text" id="nativeInput" placeholder="ಅಚ್ಚಗನ್ನಡ ಪದ (ಉದಾ: ಹೊರಿಸುವಿಕೆ)">
    <input type="text" id="altInput" placeholder="ಪರ್ಯಾಯ ಪದಗಳು (ಅಲ್ಪವಿರಾಮದಿಂದ ಬೇರ್ಪಡಿಸಿ)">
    <button class="primary" id="addWordBtn">ಪದ ಸೇರಿಸಿ (Save Root Word)</button>

    <div class="tester-box">
      <div style="font-size:11px; color:#555; margin-bottom:4px;">ಪರೀಕ್ಷಕ (Test Root Inflection Live):</div>
      <input type="text" id="testInput" placeholder="ಉದಾ: ಆರೋಪಕ್ಕೆ, ಆರೋಪಿಸಿದರು, ತೀರ್ಪಿನ">
      <button class="secondary" style="width:100%" id="runTestBtn">ಪರಿವರ್ತಿಸಿ ನೋಡಿ (Test)</button>
      <div id="testOutput"></div>
    </div>

    <div class="list-box" id="customList"></div>
  </div>

  <!-- TAB 2: 12,000-Word Bulk Importer -->
  <div id="tabBulk" class="tab-panel">
    <div class="badge" id="dictCountBadge">ಲೋಡ್ ಆದ ಪದಗಳು: 0</div>
    <div style="font-size:11.5px; color:#444; margin-bottom:6px;">
      ನಿಮ್ಮ 12,000 ಮೂಲ ಪದಗಳ ಫೈಲ್ ಅಪ್‌ಲೋಡ್ ಮಾಡಿ (Markdown Table, CSV, TSV, ಅಥವಾ JSON):
    </div>
    <input type="file" id="bulkFileInput" accept=".csv,.tsv,.txt,.md,.json">
    <button class="primary" id="importBulkBtn">ಪದಕೋಶ ಅಪ್‌ಲೋಡ್ ಮಾಡಿ (Import File)</button>
    <div style="display:flex; justify-content:space-between; margin-top:4px;">
      <button class="secondary" id="exportJsonBtn">Export JSON</button>
      <button class="secondary" id="clearMasterBtn" style="background:#c5221f;">Clear Bulk Data</button>
    </div>
  </div>

  <!-- TAB 3: Website Whitelist -->
  <div id="tabSites" class="tab-panel">
    <div class="row">
      <label for="toggleWhitelist">ಸುದ್ದಿ ತಾಣಗಳಲ್ಲಿ ಮಾತ್ರ (Whitelist Only)</label>
      <input type="checkbox" id="toggleWhitelist">
    </div>
    <input type="text" id="domainInput" placeholder="ಉದಾ: vijayavani.net">
    <button class="primary" id="addDomainBtn">ತಾಣ ಸೇರಿಸಿ (Add Website)</button>
    <div class="list-box" id="domainList"></div>
  </div>

  <div id="status"></div>

  <script src="trie_converter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
